<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롤로그 웹툰 보기 & 캐릭터 보기</title>
<style>
body {
  background: #f8f9fa;
  color: #222;
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  text-align: center;
}
header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 25px 15px 18px;
  position: sticky;
  top: 0;
  z-index: 100;
}
h1 { font-size: 1.5rem; margin: 0 0 15px; }
.tab-btn {
  padding: 10px 20px;
  font-size: 0.95rem;
  font-weight: bold;
  border: 2px solid #ff4757;
  border-radius: 25px;
  background: #fff;
  color: #ff4757;
  cursor: pointer;
  margin: 0 4px;
}
.tab-btn.active { background: #ff4757; color: #fff; }
.box { max-width: 820px; margin: 0 auto; padding: 30px 15px 60px; }
.hidden { display: none; }
.webtoon { max-width: 700px; margin: 0 auto; background: #fff; }
.webtoon img { width: 100%; display: block; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 650px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
}
.card:hover { border-color: #ff4757; }
.card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  display: block;
}
.card-name { font-size: 1.1rem; font-weight: bold; padding: 12px 5px 2px; }
.card-role { font-size: 0.85rem; color: #ff4757; padding-bottom: 12px; }
.modal-bg {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 15px;
  box-sizing: border-box;
}
.modal {
  background: #fff;
  border-radius: 18px;
  width: 100%;
  max-width: 400px;
  padding: 24px;
  text-align: left;
  position: relative;
}
.modal img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 12px;
}
.close {
  position: absolute;
  top: 10px; right: 16px;
  font-size: 1.8rem;
  border: none;
  background: none;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>프롤로그 웹툰 보기 & 캐릭터 보기</h1>
  <button class="tab-btn active" id="b1" onclick="tab(1)">프롤로그 웹툰 보기</button>
  <button class="tab-btn" id="b2" onclick="tab(2)">캐릭터 보기</button>
</header>

<div id="s1" class="box">
  <div class="webtoon">
    <img src="https://placeholder.com">
    <img src="https://placeholder.com">
  </div>
</div>

<div id="s2" class="box hidden">
  <div class="grid">
    <div class="card" onclick="openM(0)">
      <img src="https://placeholder.com">
      <div class="card-name">한소연</div>
      <div class="card-role">고문 / 여선생님</div>
    </div>
    <div class="card" onclick="openM(1)">
      <img src="https://placeholder.com">
      <div class="card-name">백하루</div>
      <div class="card-role">리드 기타</div>
    </div>
    <div class="card" onclick="openM(2)">
      <img src="https://placeholder.com">
      <div class="card-name">채은별</div>
      <div class="card-role">보컬</div>
    </div>
    <div class="card" onclick="openM(3)">
      <img src="https://placeholder.com">
      <div class="card-name">송예림</div>
      <div class="card-role">드럼</div>
    </div>
    <div class="card" onclick="openM(4)">
      <img src="https://placeholder.com">
      <div class="card-name">신솔라</div>
      <div class="card-role">베이스</div>
    </div>
    <div class="card" onclick="openM(5)">
      <img src="https://placeholder.com">
      <div class="card-name">주아나</div>
      <div class="card-role">키보드</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="mBg" onclick="closeM()">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close" onclick="closeM()">&times;</button>
    <img id="mImg" src="">
    <h2 id="mName" style="margin:0 0 5px"></h2>
    <div id="mPos" style="color:#ff4757;font-weight:bold;margin-bottom:10px"></div>
    <p id="mDesc" style="line-height:1.6;color:#444;margin:0"></p>
  </div>
</div>

<script>
const chars = [
  ["한소연", "고문 · 퇴폐미 여선생님", "항상 나른하고 피곤해 보이는 퇴폐미 여선생님. 귀찮은 걸 싫어하지만 결정적일 땐 어른답게 팀을 이끈다."],
  ["백하루", "리드 기타 · 소악마 메스카기", "귀여운 외모와 달리 입만 열면 약 올리는 건방진 성격의 천재 리드 기타리스트."],
  ["채은별", "보컬 · 반전 미녀", "누구에게나 상냥하게 웃는 완벽한 미녀 보컬이지만, 한 번 화나면 멤버 전원이 얼어붙을 정도로 무섭다."],
  ["송예림", "드럼 · 대인기피증", "눈 마주치기도 힘들어하는 소심한 대인기피증 소녀지만 드럼 스틱을 잡으면 폭발적인 비트를 뿜어낸다."],
  ["신솔라", "베이스 · 자칭 돈키호테 기사", "기사 옷을 입고 스스로를 정의의 기사라 부르는 엉뚱한 베이시스트. 진지한 말투와 달리 허당미가 넘친다."],
  ["주아나", "키보드 · SNS 갸루", "화려한 스타일과 SNS 인증샷에 진심인 인싸 갸루 키보디스트. 텐션이 높고 밴드 홍보도 담당한다."]
];

function tab(n) {
  document.getElementById('s1').classList.toggle('hidden', n !== 1);
  document.getElementById('s2').classList.toggle('hidden', n !== 2);
  document.getElementById('b1').classList.toggle('active', n === 1);
  document.getElementById('b2').classList.toggle('active', n === 2);
}

function openM(i) {
  document.getElementById('mName').innerText = chars[i][0];
  document.getElementById('mPos').innerText = chars[i][1];
  document.getElementById('mImg').src = "https://placeholder.com" + encodeURIComponent(chars[i][0]);
  document.getElementById('mDesc').innerText = chars[i][2];
  document.getElementById('mBg').style.display = 'flex';
}

function closeM() {
  document.getElementById('mBg').style.display = 'none';
}
</script>
</body>
</html>
