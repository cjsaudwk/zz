<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터&프롤로그 웹툰 보기</title>
<style>
body { background: #f8f9fa; color: #222; font-family: 'Malgun Gothic', sans-serif; margin: 0; text-align: center; }
header { background: #fff; border-bottom: 1px solid #ddd; padding: 25px 15px; }
h1 { font-size: 1.5rem; margin: 0; }
.box { max-width: 820px; margin: 0 auto; padding: 30px 15px 60px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 50px; }
@media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); } }
.card { background: #fff; border: 1px solid #ddd; border-radius: 14px; overflow: hidden; cursor: pointer; }
.card:hover { border-color: #ff4757; }
.card img { width: 100%; height: 240px; object-fit: cover; display: block; background: #eee; }
.card-name { font-size: 1.1rem; font-weight: bold; padding: 12px 5px 2px; }
.card-role { font-size: 0.85rem; color: #ff4757; padding-bottom: 12px; }
.webtoon { max-width: 700px; margin: 0 auto; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.webtoon img { width: 100%; display: block; }
.modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; }
.modal { background: #fff; border-radius: 18px; width: 100%; max-width: 400px; padding: 24px; text-align: left; position: relative; }
.modal img { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; background: #eee; }
.close { position: absolute; top: 10px; right: 16px; font-size: 1.8rem; border: none; background: none; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>캐릭터&프롤로그 웹툰 보기</h1>
</header>

<div class="box">
  <div class="grid">
    <div class="card" onclick="openM(0)"><img src="char1.png" alt="한소연"><div class="card-name">한소연</div><div class="card-role">담임선생님</div></div>
    <div class="card" onclick="openM(1)"><img src="char2.png" alt="채은별"><div class="card-name">채은별</div><div class="card-role">보컬 · 고3</div></div>
    <div class="card" onclick="openM(2)"><img src="char3.png" alt="백하루"><div class="card-name">백하루</div><div class="card-role">리드 기타 · 고2</div></div>
    <div class="card" onclick="openM(3)"><img src="char4.png" alt="신솔라"><div class="card-name">신솔라</div><div class="card-role">베이스 · 고2</div></div>
    <div class="card" onclick="openM(4)"><img src="char6.png" alt="주아나"><div class="card-name">주아나</div><div class="card-role">키보드 · 고1</div></div>
    <div class="card" onclick="openM(5)"><img src="char5.png" alt="송예림"><div class="card-name">송예림</div><div class="card-role">드럼 · 고1</div></div>
  </div>

  <div class="webtoon">
    <img src="1.png"><img src="2.png"><img src="3.png"><img src="4.png"><img src="5.png">
    <img src="6.png"><img src="7.png"><img src="8.png"><img src="9.png"><img src="10.png">
    <img src="11.png"><img src="12.png"><img src="13.png">
  </div>
</div>

<div class="modal-bg" id="mBg" onclick="closeM()">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close" onclick="closeM()">&times;</button>
    <img id="mImg" src="">
    <h2 id="mName" style="margin:0 0 5px;color:#222"></h2>
    <div id="mPos" style="color:#ff4757;font-weight:bold;margin-bottom:10px"></div>
    <p id="mDesc" style="line-height:1.6;color:#444;margin:0"></p>
  </div>
</div>

<script>
const chars = [
  ["한소연 (29세)", "담임선생님 · 나른한 여선생님 · 돈미새", "char1.png", "항상 나른하고 피곤해 보이는 퇴폐미 넘치는 29살 담임선생님. 귀찮은 일을 극도로 싫어하고 돈에 약한 돈미새지만, 은근히 학생들을 깊이 생각하며 학교에서 밴드부 애들을 가장 편견 없이 잘 대해준다."],
  ["채은별 (19세)", "보컬 · 고등학생 3학년 · 밴드부 부장 · 반전 미녀", "char2.png", "누구에게나 상냥하게 웃으며 여유로운 존댓말을 쓰는 완벽한 미녀 부장. 하지만 선을 넘거나 콤플렉스를 건드리면 거친 반말과 독설을 퍼붓는 살벌한 반전 미녀로 돌변한다."],
  ["백하루 (18세)", "리드 기타 · 고등학생 2학년 · 밴드부 차장 · 여장남자 · 메스카기", "char3.png", "귀여운 여장남자 외모와 달리 입만 열면 약 올리는 건방진 성격의 메스카기 차장. 밴드 연습 때는 걸핏하면 도망치고 부장 채은별에게 장난을 자주 쳐서 매일같이 혼나지만, 리드 기타 실력만큼은 천재적이다."],
  ["신솔라 (18세)", "베이스 · 고등학생 2학년 · 자칭 돈키호테 · 중2병", "char4.png", "언제나 기사 복장을 입고 스스로를 정의의 기사 돈키호테라 부르는 엉뚱한 베이시스트. 부원들이 '중2병이 너무 늦게 왔다'고 설명할 만큼 심각한 중2병 기사 말투를 쓰며, 가끔씩 '태양 만세!!!'를 외친다."],
  ["주아나 (18세)", "키보드 · 고등학생 1학년 · SNS중독 갸루 · 다이아 수저", "char6.png", "화려한 스타일링과 SNS 인증샷에 진심인 인싸 갸루 키보디스트. 덤벙대는 성격 탓에 밴드 물건과 핸드폰을 자주 깨뜨리지만, 엄청난 다이아 수저 집안이라 전부 사비로 즉시 복구한다."],
  ["송예림 (17세)", "드럼 · 고등학생 1학년 · 대인기피증 봉투녀", "char5.png", "사람과 눈을 마주치기 힘들어해 봉투를 쓰고 다니는 소심한 대인기피증 소녀지만, 드럼 스틱을 잡으면 폭발적인 비트를 뿜어낸다."]
];
function openM(i) {
  document.getElementById('mName').innerText = chars[i][0];
  document.getElementById('mPos').innerText = chars[i][1];
  document.getElementById('mImg').src = chars[i][2];
  document.getElementById('mDesc').innerText = chars[i][3];
  document.getElementById('mBg').style.display = 'flex';
}
function closeM() { document.getElementById('mBg').style.display = 'none'; }
</script>
</body>
</html>
